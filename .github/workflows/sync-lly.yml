name: 同步 LLY 分支

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-lly
  cancel-in-progress: false

jobs:
  sync-from-main:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 获取主分支
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 将 main 合并到 LLY
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "+refs/heads/main:refs/remotes/origin/main"

          target_ref=$(git ls-remote --heads origin refs/heads/LLY)
          if [[ -n "$target_ref" ]]; then
            git fetch origin "+refs/heads/LLY:refs/remotes/origin/LLY"
            git switch -C LLY origin/LLY
            if ! git merge --no-edit origin/main; then
              git merge --abort || true
              echo "::error::main 无法自动合并到 LLY，请手动解决冲突后重新运行。"
              exit 1
            fi
          else
            git switch -C LLY origin/main
          fi

          git push origin HEAD:refs/heads/LLY
